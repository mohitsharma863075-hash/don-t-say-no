        <!-- No Click Counter -->
        <div id="no-counter" style="margin-top: 15px; font-size: 18px; color: #ff6b6b; font-weight: bold;"></div>

        <div class="btn">
            <a href="yes.html" class="yes-btn">Yes ❤️</a>

        </div>

    <script>
        // No Click Counter
        let noCount = localStorage.getItem('noClicks') || 0;
        noCount = parseInt(noCount) + 1;
        localStorage.setItem('noClicks', noCount);

        // Show counter
        document.getElementById('no-counter').innerHTML = `You said No ${noCount} times! 😂`;

        // Move button function
        function moveRandomEl(elm) {
            elm.style.position = "fixed";
            elm.style.top = Math.floor(Math.random() * 70 + 10) + "%";
            elm.style.left = Math.floor(Math.random() * 70 + 10) + "%";
            elm.style.transition = "all 0.2s ease";
            elm.style.zIndex = "9999";
        }

        const moveRandom = document.querySelector("#move-random");

        // Desktop hover
        moveRandom.addEventListener("mouseenter", function(e) {
            moveRandomEl(e.target);
        });

        // Mobile touch
        moveRandom.addEventListener("touchstart", function(e) {
            e.preventDefault();
            moveRandomEl(e.target);
        });

        // Mobile click
        moveRandom.addEventListener("click", function(e) {
            e.preventDefault();
            moveRandomEl(e.target);
        });

        // Also move on page load (so it starts in random position)
        setTimeout(() => {
            moveRandomEl(moveRandom);
        }, 300);
    </script>
